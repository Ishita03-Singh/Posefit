[project]
name = "posefit-tools"
version = "0.1.0"
description = "PoseFit offline tools: pose template authoring from reference photos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=1.0.1",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
