# Local development services. Start with: docker compose up -d db
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      # Dev-only credentials; the database is only exposed on this machine.
      POSTGRES_USER: posefit
      POSTGRES_PASSWORD: REDACTED
      POSTGRES_DB: posefit
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posefit"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
